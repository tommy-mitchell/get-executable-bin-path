name: CI Lint
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      # TODO: remove --legacy-peer-deps when updating XO config
      - run: npm install --legacy-peer-deps
      - run: npm run lint
